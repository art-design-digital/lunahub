[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "ghostscript", "poppler_utils", "binutils", "imagemagick"]

[phases.install]
cmds = ["npx --yes n 22.14.0", "hash -r", "npm ci"]

[phases.build]
cmds = ["npm run build", "cp -r .next/static .next/standalone/.next/static", "cp -r public .next/standalone/public"]

[start]
cmd = "node .next/standalone/server.js"
